<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="下午茶">
  <title>下午茶筆記</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1>下午茶筆記</h1>
      <div class="head-actions">
        <button class="chip-btn" id="pasteBtn" aria-label="從剪貼簿新增">📋 貼上</button>
        <button class="chip-btn" id="viewBtn" aria-label="切換地圖">🗺️ 地圖</button>
        <button class="icon-btn" id="menuBtn" aria-label="選單">⋯</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="搜尋店名、地區、標籤…" autocomplete="off">
    <div class="tabs" role="tablist">
      <button class="tab active" data-filter="all">全部 <span id="cAll"></span></button>
      <button class="tab" data-filter="want">想去 <span id="cWant"></span></button>
      <button class="tab" data-filter="visited">去過 <span id="cVisited"></span></button>
      <select id="sort" aria-label="排序">
        <option value="updated">最近更新</option>
        <option value="rating">評分高→低</option>
        <option value="name">店名</option>
      </select>
    </div>
  </header>

  <main id="list" class="list"></main>
  <section id="mapView" class="map-view" hidden>
    <div id="map"></div>
    <div id="geoBar" class="geo-bar" hidden></div>
    <button class="map-btn" id="locateBtn" aria-label="我的位置">◎</button>
  </section>
  <p id="empty" class="empty" hidden>還沒有紀錄<br>按右下角 ＋ 新增第一家店</p>

  <button class="fab" id="addBtn" aria-label="新增">＋</button>

  <!-- 新增 / 編輯 -->
  <dialog id="editor" class="sheet">
    <form id="form" method="dialog">
      <div class="sheet-head">
        <button type="button" class="link" id="cancelBtn">取消</button>
        <strong id="editorTitle">新增店家</strong>
        <button type="submit" class="link strong">儲存</button>
      </div>
      <div class="sheet-body">
        <label class="photo-pick" id="photoPick">
          <img id="photoPreview" alt="" hidden>
          <span id="photoHint">＋ 加照片</span>
          <input type="file" id="photoInput" accept="image/*" hidden>
        </label>
        <button type="button" class="link danger small" id="photoRemove" hidden>移除照片</button>

        <label>店名 *<input name="name" required maxlength="80"></label>
        <label>地區<input name="area" placeholder="例：大安區、中山站" maxlength="40"></label>
        <label>地址或 Google 地圖連結
          <span class="input-row">
            <input name="address" maxlength="500" placeholder="地址，或貼上 maps.app.goo.gl/…">
            <button type="button" class="chip-btn" id="pasteMapBtn">貼上</button>
            <button type="button" class="chip-btn" id="openMapBtn" aria-label="在地圖開啟">📍</button>
          </span>
        </label>
        <div class="loc-row">
          <span id="locStatus" class="loc-status">位置：未設定</span>
          <button type="button" class="chip-btn" id="geocodeBtn">自動定位</button>
          <button type="button" class="chip-btn" id="pickLocBtn">在地圖上選</button>
        </div>
        <label>IG／來源連結
          <span class="input-row">
            <input name="sourceUrl" type="url" inputmode="url" placeholder="https://www.instagram.com/p/…" maxlength="500">
            <button type="button" class="chip-btn" id="pasteSourceBtn">貼上</button>
          </span>
        </label>

        <div class="seg" role="radiogroup">
          <label><input type="radio" name="status" value="want" checked><span>想去</span></label>
          <label><input type="radio" name="status" value="visited"><span>去過</span></label>
        </div>

        <div class="visited-only">
          <div class="field-label">評分</div>
          <div class="stars" id="stars"></div>
          <label>造訪日期<input type="date" name="visitedAt"></label>
        </div>

        <label>每人大約價位<input name="price" inputmode="numeric" placeholder="例：450"></label>
        <label>標籤（用空白或逗號分隔）<input name="tags" placeholder="甜點 司康 安靜 可插座"></label>
        <label>筆記<textarea name="notes" rows="4" placeholder="推薦餐點、氣氛、要不要訂位…"></textarea></label>

        <button type="button" class="danger-btn" id="deleteBtn" hidden>刪除這家店</button>
      </div>
    </form>
  </dialog>

  <!-- 在地圖上選位置 -->
  <dialog id="picker" class="sheet">
    <div class="sheet-head">
      <button type="button" class="link" id="pickCancel">取消</button>
      <strong>點地圖設定位置</strong>
      <button type="button" class="link strong" id="pickOk">使用</button>
    </div>
    <div id="pickMap" class="pick-map"></div>
  </dialog>

  <!-- 選單 -->
  <dialog id="menu" class="sheet small-sheet">
    <div class="sheet-head">
      <span></span><strong>選單</strong>
      <button type="button" class="link" data-close>完成</button>
    </div>
    <div class="sheet-body">
      <a class="menu-item" id="installShortcut" href="https://www.icloud.com/shortcuts/92b988b274084014bbebccc5750cf06e" target="_blank" rel="noopener">⚡ 安裝「加到下午茶」捷徑</a>
      <p class="hint">裝好後，在 IG 或 Google 地圖按「分享 → 加到下午茶」就能收藏。</p>
      <label class="menu-item">📥 匯入捷徑收件匣（teatime-inbox.txt）<input type="file" id="inboxInput" accept=".txt,text/plain" hidden></label>
      <p class="hint">用「存到下午茶」捷徑收藏的店會累積在 iCloud 雲碟的 Shortcuts/teatime-inbox.txt，從這裡一次匯入，重複的連結會自動略過。</p>
      <p class="hint">🗺️ 想同步到 Google 地圖：點店家的「📍 地圖」→ 在 Google 地圖按「儲存」→ 選你的「下午茶」清單。</p>
      <button class="menu-item" id="exportBtn">匯出備份（JSON）</button>
      <label class="menu-item">匯入備份<input type="file" id="importInput" accept="application/json,.json" hidden></label>
      <p class="hint">資料只存在這台裝置的瀏覽器裡。iOS 可能清除很久沒開的網站資料，建議定期匯出備份。</p>
    </div>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
